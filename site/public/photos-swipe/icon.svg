<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.143" stop-color="#0B1240"/>
      <stop offset="0.536" stop-color="#1F2FD1"/>
      <stop offset="0.857" stop-color="#5BD6F2"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7925F"/>
      <stop offset="1" stop-color="#F4A677"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9A08C"/>
      <stop offset="1" stop-color="#9A6585"/>
    </linearGradient>
    <clipPath id="sq"><rect width="120" height="120" rx="27"/></clipPath>
    <clipPath id="photo"><rect x="-30" y="-40" width="60" height="80" rx="11"/></clipPath>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#00001a" flood-opacity="0.45"/>
    </filter>
    <filter id="bsh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#00001a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="120" height="120" fill="url(#bg)"/>
    <!-- back card -->
    <g transform="translate(65.9 50.2) rotate(-14)">
      <rect x="-28" y="-36" width="56" height="72" rx="11" fill="rgba(255,255,255,0.28)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    </g>
    <!-- front card: sunset photo -->
    <g transform="translate(50.1 69.8) rotate(8)" filter="url(#sh)">
      <g clip-path="url(#photo)">
        <rect x="-30" y="-40" width="60" height="80" fill="url(#sky)"/>
        <circle cx="0" cy="-17" r="10" fill="#FFF0BE"/>
        <path d="M-30 4 L-19 -9 L-11 -1 L-3 -6 L7 -14 L17 -3 L30 -10 L30 10 L-30 10 Z" fill="#B86E82"/>
        <path d="M-30 8 L-14 2 L-4 6 L9 -1 L20 5 L30 2 L30 12 L-30 12 Z" fill="#5B3A5A"/>
        <rect x="-30" y="11" width="60" height="29" fill="url(#water)"/>
        <ellipse cx="0" cy="22" rx="2.2" ry="8" fill="#FFE6C8" opacity="0.45"/>
      </g>
      <rect x="-30" y="-40" width="60" height="80" rx="11" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2"/>
    </g>
    <!-- glass keep badge -->
    <g filter="url(#bsh)">
      <circle cx="91" cy="91" r="16.8" fill="rgba(255,255,255,0.24)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
    </g>
    <path transform="translate(82 82.5) scale(0.75)" fill="#fff" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </g>
</svg>
